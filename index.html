<style>

<script>

const SB_URL='https://fztcmzjypmanmkyjyisc.supabase.co',SB_KEY='sb_publishable_Y-JK3_zjAI81Erah5ZqHHQ_NABoaUSd';

try{S=JSON.parse(localStorage.getItem('catseat')||'')||S}catch(e){}

setInterval(load,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()})}
function login(msg){mode='';$('#app').innerHTML=`<div class="card" style="max-width:360px;margin:10vh auto"><h1>擼貓座位管理</h1><p class="mu">員工登入</p><label>Email<input id="lm" type="email" autocomplete="username" autocapitalize="none" autocorrect="off"></label><label>密碼<input id="lp" type="password" autocomplete="current-password"></label><div id="er">${msg||''}</div><div class="bt"><button onclick="doLogin()">登入</button></div></div>`}

async function boot(){if(!window.supabase){cal();return}sb=supabase.createClient(SB_URL,SB_KEY);
sb.auth.onAuthStateChange(ev=>{if(ev=='SIGNED_OUT'){DB=false;S={recs:[],hol:{}};syn={};closeM();login()}});
const{data}=await sb.auth.getSession();data.session?start():login()}
const CAP={B1:2,B3:2,B5:1,B6:1,B7:1,B8:1,B2:4,B4:3};for(let i=1;i<=18;i++)CAP['A'+i]=i<=6?2:1;
const POS={A1:[205,628],A2:[430,630],A3:[314,800],A4:[318,936],A5:[212,1090],A6:[437,1091],A7:[670,459],A8:[670,630],A9:[670,766],A10:[670,948],A11:[670,1083],A12:[670,1248],A13:[893,525],A14:[893,657],A15:[893,789],A16:[893,921],A17:[893,1053],A18:[893,1185],B1:[1210,672],B2:[1502,546],B3:[1211,973],B4:[1508,1140],B5:[1803,493],B6:[1803,633],B7:[1803,769],B8:[1803,910]};
const SLOTS=['11:00','13:00','15:00','17:00','19:00'];
const hm=x=>{const d=x?new Date(x):new Date();return pad(d.getHours())+':'+pad(d.getMinutes())},tsOf=v=>{const[a,b]=v.split(':'),d=new Date();d.setHours(+a,+b,0,0);return d.getTime()};
const pad=n=>String(n).padStart(2,'0'),fk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>fk(new Date());
const hol=k=>k in S.hol?S.hol[k]:[0,6].includes(new Date(k+'T00:00').getDay());
const lim=r=>hol(r.date)&&r.type==='res'?105:90;
const fullRec=k=>S.recs.find(r=>r.type==='full'&&r.date===k&&!r.off),limOn=r=>hol(r.date)||!!fullRec(r.date);
const at=r=>new Date(r.date+'T'+r.time+':00').getTime();
const ok=r=>!r.cancel&&!r.done;
const ss=r=>r.w?[r.seat,r.w]:[r.seat],ad=r=>r.adult??r.pax,kids=r=>r.kid||0,cap=(s,w)=>CAP[s]+(w?CAP[w]:0),fp=r=>r.seat[0]=='B'?ad(r)+'人':ad(r)+'大'+kids(r)+'小';
const seated=(k,s)=>S.recs.find(r=>r.date===k&&ss(r).includes(s)&&r.seatedAt&&ok(r));
const booked=(k,s)=>S.recs.filter(r=>r.date===k&&ss(r).includes(s)&&r.type==='res'&&!r.seatedAt&&ok(r)).sort((a,b)=>a.time<b.time?-1:1);
const LK=100*60000,locked=b=>!!b.seat&&Date.now()>=at(b)-LK;
let cm=new Date();cm=new Date(cm.getFullYear(),cm.getMonth(),1);let sel='',mode='',fl='A';
const modal=h=>{$('#mo').innerHTML='<div class="mb" onclick="if(event.target==this)closeM()"><div class="md">'+h+'</div></div>';$('#mo').style.display='block'};
const closeM=()=>{$('#mo').style.display='none';$('#mo').innerHTML=''};
const WD='日一二三四五六';
function cal(){sel='';mode='';document.body.classList.remove('aid');const y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let c='';
for(let i=0;i<f;i++)c+='<i></i>';
for(let d=1;d<=n;d++){const k=y+'-'+pad(m+1)+'-'+pad(d),cnt=S.recs.filter(r=>r.date===k&&r.type==='res'&&!r.cancel).length;
c+=`<button class="day${hol(k)?' h':''}${k===today()?' t':''}" onclick="pick('${k}')"><b>${d}</b>${cnt?`<span>${cnt} 組預約</span>`:''}</button>`}
$('#app').innerHTML=`<div class="top"><div><h1>擼貓座位管理</h1><small>員工登記系統・${sb?`<a onclick="sb.auth.signOut()" style="cursor:pointer;text-decoration:underline">登出</a>`:'僅存於本機'}</small></div><div><button class="g" onclick="mv(-1)">‹</button> <b>${y} 年 ${m+1} 月</b> <button class="g" onclick="mv(1)">›</button></div></div><div class="card"><div class="wk">${[...WD].map(x=>`<div>${x}</div>`).join('')}</div><div class="grid">${c}</div><p class="mu" style="font-size:12px;margin:10px 0 0">奶茶色底為假日（六日與自訂例假日）。</p></div>`}
const mv=d=>{cm=new Date(cm.getFullYear(),cm.getMonth()+d,1);cal()};
function pick(k){sel=k;const h=hol(k),d=new Date(k+'T00:00');
modal(`<h3>${k.replace(/-/g,' / ')} 週${WD[d.getDay()]} <small>${h?'假日':'平日'}</small></h3><p class="mu" style="font-size:13px">${h?'現場客 90 分鐘・預約客 105 分鐘':'滿座時限時 90 分鐘'}</p><div class="bt col"><button onclick="go('reserve')">訂位管理</button><button onclick="go('live')">目前座位</button><button class="g" onclick="setHol('${k}',${!h})">${h?'改為平日':'標記為例假日'}</button></div>`)}
function setHol(k,v){S.hol[k]=v;save();closeM();cal()}

function shell(){$('#app').innerHTML=`<div class="top"><button class="g" onclick="cal()">‹ 月曆</button><div><b>${sel}</b> <small>${mode=='reserve'?'訂位管理':'目前座位'}</small></div><button class="g" onclick="mode=mode=='reserve'?'live':'reserve';shell()">切換到${mode=='reserve'?'目前座位':'訂位管理'}</button></div>
<div class="card"><div class="tabs"><button id="tA" onclick="fl='A';stage()">一樓</button><button id="tB" onclick="fl='B';stage()">二樓</button>${mode=='reserve'?'<button style="background:var(--acc);color:#fff" onclick="resNew()">新增訂位</button>':'<span class="mu" style="font-size:12px">點座位入座、轉檯或離席</span>'}<span style="margin-left:auto;display:flex;gap:6px"><button id="vT" onclick="setView('tab')">平板模式</button><button id="vP" onclick="setView('ph')">手機模式</button></span></div>
<div class="lg"><span><i></i>現場客</span><span><i class="r"></i>預約客</span><span>閃爍＝即將到時／超時</span><span>預約前 1 小時 40 分自動鎖位</span></div><div class="sc"><div class="stg" id="stg"></div></div></div><div class="card" id="rl" style="margin-top:12px"></div><div id="aid"></div>`;stage()}
function stage(){if(!$('#stg'))return;const B=fl=='B',ox=B?1090:60,oy=380,W=B?840:960,H=B?860:960,sz=(B?112:120)/W*100;
$('#tA').className=B?'':'on';$('#tB').className=B?'on':'';const ph=vw=='ph';$('#stg').className='stg'+(ph?' ph':'');$('#stg').style.aspectRatio=ph?'auto':W+'/'+H;$('#vT').className=ph?'':'on';$('#vP').className=ph?'on':'';if($('#vA'))$('#vA').className=aid?'on':'';const k=sel,now=Date.now();let h='';if(mode=='live'){const wd=!hol(k)&&k==today(),f=wd&&fullRec(k);h+='<div class="tl">'+(wd?`<button class="fullbtn${f?' on':''}" onclick="toggleFull()">${f?'客滿中 '+hm(f.fullAt)+'・按此取消':'客滿'}</button>`:'')+`<button class="aidbtn${aid?' on':''}" onclick="toggleAid()">輔助</button></div>`}
for(const s in POS){if(s[0]!=fl)continue;const[x,y]=POS[s],rect=!B&&+s.slice(1)>=13;let cl='seat'+(rect?' rect':''),sub=CAP[s]+'人',tm='—';
if(mode=='reserve'){const l=S.recs.filter(r=>r.date===k&&ss(r).includes(s)&&r.type==='res'&&ok(r)).sort((a,b)=>a.time<b.time?-1:1);if(l.length){cl+=' res';sub=l.slice(0,2).map(r=>r.time+' '+r.name+(r.w?' 併':'')).join('<br>')}tm=l.length?l.length+' 組預約':'可訂位'}
else{const o=seated(k,s),bs=booked(k,s);
if(o){const el=Math.floor((now-o.seatedAt)/60000),rm=lim(o)-el;cl+=o.type=='res'?' res':'';cl+=limOn(o)?(rm<0?' over':rm<=10?' warn':''):'';sub=o.seat===s?(o.name||'現場')+' '+fp(o):'併 '+o.seat;tm=limOn(o)?`入座${el}分・${rm>=0?'剩'+rm:'超'+-rm}分`:`入座${el}分`}
else if(bs.length){const b=bs[0];if(locked(b)){cl+=' res';sub='🔒'+b.time+'<br>'+(b.seat===s?b.name+' '+fp(b):'併 '+b.seat);tm='預約保留中'}else{cl+=' fut';sub=b.time+' 預約'}}}
const st=ph?'':` style="left:${(x-ox)/W*100}%;top:${(y-oy)/H*100}%;width:${rect?15.6:sz}%;${rect?'height:'+(100/H*100)+'%':'aspect-ratio:1'}"`;h+=`<div class="${cl}"${st} onclick="seatClick('${s}')"><b>${s}</b><span>${sub}</span><span class="tm">${tm}</span></div>`}
$('#stg').innerHTML=h;rl();aidBar()}
setInterval(()=>{if(mode=='live'&&$('#mo').style.display!='block')stage()},15000);
const seatClick=s=>mode=='reserve'?seatInfo(s):liveSeat(s);
const sameFl=(s,f)=>Object.keys(CAP).filter(t=>t!=s&&t[0]==s[0]&&(!f||f(t))).map(t=>`<option value="${t}">${t}（${CAP[t]}人）</option>`).join('');
const FC={A:24,B:15},rf=r=>r.fl||(r.seat&&r.seat[0])||'A',rem=o=>limOn(o)?lim(o)-Math.floor((Date.now()-o.seatedAt)/60000):null;
const TOTAL=Object.values(CAP).reduce((a,b)=>a+b,0);
const avail=(r,t)=>{const L=lim(r)*60000,tt=at(r);return !S.recs.some(o=>o.id!==r.id&&o.date===r.date&&o.type==='res'&&ok(o)&&ss(o).includes(t)&&Math.abs(at(o)-tt)<L)};
function resNew(){const k=sel,h=hol(k);
modal(`<h3>新增訂位 <small>${k}</small></h3><label>姓氏<input id="f1" maxlength="6"></label><div class="two"><label>大人<input id="f2" type="number" min="1" value="1"></label><label>小孩（12歲以下）<input id="f5" type="number" min="0" value="0"></label></div><label>手機電話<input id="f3" type="tel" inputmode="tel"></label><label>樓層<select id="f7"><option value="A">一樓</option><option value="B">二樓（不可有 12 歲以下小孩）</option></select></label><label>${h?'預約時段':'預約時間'}${h?`<select id="f4">${SLOTS.map(t=>`<option>${t}</option>`).join('')}</select>`:'<input id="f4" type="time" value="12:00">'}</label>
<div class="wn">⚠️ 請提醒客人<br>・入內須穿襪子<br>・12 歲以下視為小孩<br>・小孩不得進入二樓用餐<br>・座位依現場情況安排，預約前 1 小時 40 分起會保留</div><div id="er"></div><div class="bt"><button class="g" onclick="closeM()">取消</button><button onclick="saveR()">確定訂位</button></div>`)}
function saveR(){const v=i=>$('#f'+i).value.trim(),name=v(1),a=+v(2),kk=+v(5)||0,phone=v(3),time=v(4),e=m=>$('#er').textContent=m;
if(!name)return e('請填姓氏');const fl=$('#f7').value;if(!(a>=1))return e('大人至少 1 位');if(kk<0)return e('小孩人數錯誤');if(fl=='B'&&kk>0)return e('二樓不能有 12 歲以下小孩');if(phone.replace(/\D/g,'').length<8)return e('請填正確手機電話');if(!time)return e('請選時間');
const pax=a+kk,r={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),date:sel,seat:'',w:'',fl,type:'res',name,adult:a,kid:kk,pax,phone,time};
const L=lim(r)*60000,tt=at(r),tot=S.recs.filter(o=>o.date===sel&&o.type==='res'&&ok(o)&&rf(o)===fl&&Math.abs(at(o)-tt)<L).reduce((n,o)=>n+o.pax,0);
if(tot+pax>FC[fl])return e(`${fl=='A'?'一樓':'二樓'}該時段已訂 ${tot} 人，座位共 ${FC[fl]} 人，放不下這組`);
S.recs.push(r);save();closeM();stage()}
function seatInfo(s){const k=sel,l=S.recs.filter(r=>r.date===k&&ss(r).includes(s)&&r.type==='res'&&ok(r)).sort((a,b)=>a.time<b.time?-1:1),u=S.recs.filter(r=>r.date===k&&r.type==='res'&&ok(r)&&!r.seat&&!r.seatedAt);
modal(`<h3>${s} <small>${CAP[s]} 人座</small></h3>`+(l.length?'<div class="ls">'+l.map(r=>`<div>${r.time} ${ss(r).join('＋')} ${r.name} ${fp(r)} ${r.seatedAt?'<em>已入座</em>':`<button class="sm" onclick="cancelR('${r.id}')">取消</button>`}</div>`).join('')+'</div>':'<p class="mu">這個座位目前沒有預約。</p>')+(u.length?'<p class="mu" style="margin:6px 0">安排預約到此座位：</p><div class="bt col">'+u.map(r=>`<button class="g" onclick="assignModal('${r.id}','${s}')">${r.time} ${r.name} ${fp(r)}</button>`).join('')+'</div>':'')+'<div class="bt" style="margin-top:10px"><button class="g" onclick="closeM()">關閉</button></div>')}
const occTxt=(o,r)=>{const m=rem(o);if(m===null)return '目前有客（不限時）';let s=m>=0?`目前有客・剩${m}分`:`目前有客・已超時${-m}分`;if(r&&Date.now()+Math.max(m,0)*60000>at(r))s+='・可能趕不上預約';return s};
const seatOpts=(r,av,x)=>av.map(t=>{const sd=r.date==today()&&seated(r.date,t);return `<option value="${t}"${t==x?' selected':''}>${t}（${CAP[t]}人）${sd?'・'+occTxt(sd,r):''}</option>`}).join('');
const availList=(r,ex)=>Object.keys(CAP).filter(t=>t!=ex&&avail(r,t)&&!(kids(r)>0&&t[0]=='B')).sort((a,b)=>(a[0]!=rf(r))-(b[0]!=rf(r))||(CAP[a]<r.pax)-(CAP[b]<r.pax)||CAP[a]-CAP[b]);
function assignModal(id,pre){const r=S.recs.find(x=>x.id==id),av=availList(r,''),soon=r.date==today()&&Date.now()>=at(r)-LK;
modal(`<h3>安排座位 <small>${r.time} ${r.name} ${fp(r)}</small></h3><p class="mu">客人想坐${rf(r)=='A'?'一樓':'二樓'}，可依現場狀況改選其他座位。${soon?'目前有客的座位會標示剩餘時間，請選預計能在預約時間前空出的座位。':'預約前 1 小時 40 分起，這個座位會自動鎖住。'}</p><label>座位<select id="as1">${seatOpts(r,av,pre||r.seat)}</select></label><label>併桌（選填，同樓層）<select id="as2"><option value="">不併桌</option>${seatOpts(r,av,r.w)}</select></label><div id="er"></div><div class="bt">${r.seat?`<button class="g" onclick="unassign('${id}')">取消安排</button>`:''}<button class="g" onclick="closeM()">關閉</button><button onclick="assign('${id}')">確定保留</button></div>`)}
function assign(id){const r=S.recs.find(x=>x.id==id),t=$('#as1').value,w=$('#as2').value,e=m=>$('#er').textContent=m;
if(!t)return e('沒有可選的座位');if(w&&w==t)return e('座位與併桌不能是同一桌');if(w&&w[0]!=t[0])return e('併桌需在同一樓層');if(r.pax>cap(t,w))return e(`容量不足（最多 ${cap(t,w)} 人），可選擇併桌`);if(kids(r)>0&&(t[0]=='B'||w[0]=='B'))return e('有小孩不能安排二樓');
r.seat=t;r.w=w;save();closeM();stage()}
function unassign(id){const r=S.recs.find(x=>x.id==id);r.seat='';r.w='';save();closeM();stage()}
function bookModal(id){const b=S.recs.find(x=>x.id==id);modal(`<h3>${ss(b).join('＋')} <small>預約入座</small></h3><p>${b.time}・${b.name}・${fp(b)}<br>${b.phone}</p><label>入座時間（可往前調整）<input id="st" type="time" value="${hm()}"></label><div id="er"></div><div class="bt"><button class="g" onclick="cancelR('${b.id}')">取消預約</button><button class="g" onclick="swapModal('${b.id}')">現場客先坐這裡</button><button onclick="seatRes('${b.id}')">客人到了・入座</button></div>`)}
function swapModal(id){const b=S.recs.find(x=>x.id==id),s=b.seat,av=availList(b,s);
modal(`<h3>現場客先坐 ${s}</h3><p class="mu">原預約 ${b.time} ${b.name} ${fp(b)} 會改排到下面選的座位，選有客人的座位時請看剩餘時間。</p><label>預約客改排到<select id="sw1">${seatOpts(b,av,'')}</select></label><label>併桌（選填，同樓層）<select id="sw2"><option value="">不併桌</option>${seatOpts(b,av,'')}</select></label><div class="two"><label>現場客 大人<input id="sa" type="number" min="1" value="1"></label>${s[0]=='B'?'':'<label>小孩（12歲以下）<input id="sk" type="number" min="0" value="0"></label>'}</div><label>入座時間（可往前調整）<input id="sw" type="time" value="${hm()}"></label><div id="er"></div><div class="bt"><button class="g" onclick="closeM()">取消</button><button onclick="doSwap('${id}')">確定</button></div>`)}
function doSwap(id){const b=S.recs.find(x=>x.id==id),s=b.seat,t=$('#sw1').value,w=$('#sw2').value,a=+$('#sa').value,kk=$('#sk')?(+$('#sk').value||0):0,tv=$('#sw').value,ts=tv?tsOf(tv):0,e=m=>$('#er').textContent=m;
if(sel!=today())return e('只能在當天登記入座');if(!t)return e('沒有可改排的座位');if(w&&w==t)return e('座位與併桌不能是同一桌');if(w&&w[0]!=t[0])return e('併桌需在同一樓層');if(b.pax>cap(t,w))return e(`預約客容量不足（最多 ${cap(t,w)} 人）`);if(kids(b)>0&&(t[0]=='B'||w[0]=='B'))return e('有小孩不能安排二樓');
if(!(a>=1)||a+kk>CAP[s])return e(`${s} 最多 ${CAP[s]} 人`);if(!ts)return e('請填入座時間');if(ts>Date.now()+60000)return e('入座時間不能晚於現在');
S.recs.push({id:Date.now().toString(36),date:b.date,seat:s,w:'',type:'walk',adult:a,kid:kk,pax:a+kk,seatedAt:ts});b.seat=t;b.w=w;save();closeM();stage()}
function jump(s){fl=s[0];stage();liveSeat(s)}
function rl(){const el=$('#rl');if(!el)return;const k=sel,now=Date.now(),td=k==today(),L=S.recs.filter(r=>r.date===k&&r.type==='res'&&ok(r)).sort((a,b)=>a.time<b.time?-1:1);
const need=L.filter(r=>!r.seat&&!r.seatedAt&&td&&now>=at(r)-LK).length;
el.innerHTML=`<h3 style="margin:0 0 6px">預約名單 <small>${L.length} 組</small>${need?` <span class="bd">${need} 組需安排座位</span>`:''}</h3>`+(L.length?L.map(r=>{const lk=hm(at(r)-LK);let st,c='';
if(r.seatedAt)st='已入座';else if(!r.seat){if(td&&now>=at(r)-LK){st='需安排座位（已到保留時間）';c=' rd'}else st=`${lk} 起需保留座位`}else st=`已安排 ${ss(r).join('＋')}${locked(r)?'（已鎖位）':`（${lk} 起鎖位）`}`;
return `<div class="rr"><b>${r.time}</b><span>${r.name} ${fp(r)}</span><span class="mu">${rf(r)=='A'?'一樓':'二樓'}・${r.phone}</span><span class="st${c}">${st}</span>`+(r.seatedAt?'':`<button class="sm g" onclick="assignModal('${r.id}')">${r.seat?'更換座位':'安排座位'}</button>`+(r.seat&&td?`<button class="sm g" onclick="bookModal('${r.id}')">入座</button>`:'')+`<button class="sm" onclick="cancelR('${r.id}')">取消</button>`)+'</div>'}).join(''):'<p class="mu" style="margin:0">這天還沒有預約。</p>')}
function toggleAid(){aid=!aid;stage()}
function aidBar(){const el=$('#aid');if(!el)return;const on=aid&&mode=='live';document.body.classList.toggle('aid',on);if(!on)return;const k=sel,now=Date.now();
if(k!=today()){el.innerHTML='<b>輔助</b>：即時可入座位置只在當天顯示。';return}
const ch=f=>Object.keys(CAP).filter(s=>s[0]==f&&!seated(k,s)).map(s=>{const b=booked(k,s)[0];if(b&&locked(b))return '';const ln=b?at(b)-LK:0,tail=b&&ln-now<90*60000?`<em>坐到 ${hm(ln)}</em>`:'';return `<span class="chip" onclick="jump('${s}')">${s}・${CAP[s]}人${tail}</span>`}).join('');
const a=ch('A'),b2=ch('B'),nd=S.recs.filter(r=>r.date===k&&r.type==='res'&&ok(r)&&!r.seat&&!r.seatedAt).sort((x,y)=>x.time<y.time?-1:1);
const so=Object.keys(CAP).filter(s=>{const o=seated(k,s);return o&&o.seat===s&&rem(o)!==null&&rem(o)<=30}).map(s=>{const m=rem(seated(k,s));return `<span class="chip" onclick="jump('${s}')">${s}・${m>=0?'剩'+m+'分':'已超時'+(-m)+'分'}</span>`}).join('');
el.innerHTML=`<b>目前可入座</b><div>一樓：${a||'<span class="mu">已無空位</span>'}</div><div>二樓（不可帶小孩）：${b2||'<span class="mu">已無空位</span>'}</div>`+(so?`<div>即將空出：${so}</div>`:'')+(nd.length?`<div class="rd">預約待安排座位：${nd.map(r=>`${r.time} ${r.name} ${fp(r)}（${now>=at(r)-LK?'現在就要安排':hm(at(r)-LK)+' 前安排'}）`).join('；')}</div>`:'')}
function cancelR(id){const r=S.recs.find(x=>x.id==id);r.cancel=1;save();closeM();stage()}
const free=(k,t,id)=>!S.recs.some(r=>r.date===k&&r.id!==id&&r.seatedAt&&ok(r)&&ss(r).includes(t))&&!booked(k,t).some(b=>b.id!==id&&locked(b));
function liveSeat(s){const k=sel,o=seated(k,s),bs=booked(k,s);
if(o){if(o.seat!==s)return liveSeat(o.seat);const el=Math.floor((Date.now()-o.seatedAt)/60000),all=Object.keys(CAP).filter(t=>free(k,t,o.id)),op=(x)=>all.map(t=>`<option value="${t}"${t==x?' selected':''}>${t}（${CAP[t]}人）</option>`).join('');
modal(`<h3>${ss(o).join('＋')} <small>${o.type=='res'?'預約客 '+o.name:'現場客'}・${fp(o)}</small></h3><p>已入座 <b>${el}</b> 分鐘${limOn(o)?'／時限 '+lim(o)+' 分鐘':'（目前未客滿，不限時）'}</p><label>入座時間（可修正）<input id="et" type="time" value="${hm(o.seatedAt)}"></label><label>主座位（轉檯）<select id="mv">${op(o.seat)}</select></label><label>併桌（選填）<select id="mw"><option value="">不併桌</option>${op(o.w)}</select></label><div id="er"></div><div class="bt"><button onclick="move('${o.id}')">儲存修改</button><button class="g" onclick="leave('${o.id}')">客人離席</button></div>`)}
else if(bs.length&&locked(bs[0]))bookModal(bs[0].id);
else modal(`<h3>${s} <small>${CAP[s]} 人座</small></h3>${bs.length?`<p class="mu">此位 ${bs[0].time} 有預約，請於其前 2 小時內使用完畢。</p>`:''}<div class="two"><label>大人<input id="wa" type="number" min="1" value="1"></label>${s[0]=='B'?'':'<label>小孩（12歲以下）<input id="wk" type="number" min="0" value="0"></label>'}</div><label>併桌（選填，同樓層）<select id="ww"><option value="">不併桌</option>${sameFl(s,t=>free(k,t,''))}</select></label><label>入座時間（可往前調整）<input id="wt" type="time" value="${hm()}"></label><div id="er"></div><div class="bt"><button class="g" onclick="closeM()">取消</button><button onclick="walk('${s}')">入座</button></div>`)}
function walk(s){const e=m=>$('#er').textContent=m;if(sel!=today())return e('只能在當天登記入座');const a=+$('#wa').value,kk=$('#wk')?(+$('#wk').value||0):0,w=$('#ww').value,p=a+kk;
if(!(a>=1)||kk<0)return e('大人至少 1 位');if(p>cap(s,w))return e(`最多 ${cap(s,w)} 人`);
const tv=$('#wt').value,ts=tv?tsOf(tv):0;if(!ts)return e('請填入座時間');if(ts>Date.now()+60000)return e('入座時間不能晚於現在');S.recs.push({id:Date.now().toString(36),date:sel,seat:s,w,type:'walk',adult:a,kid:kk,pax:p,seatedAt:ts});save();closeM();stage()}
function toggleFull(){const f=fullRec(sel);if(f)f.off=Date.now();else S.recs.push({id:'f'+Date.now().toString(36),date:sel,type:'full',fullAt:Date.now()});save();stage()}
function seatRes(id){const r=S.recs.find(x=>x.id==id),tv=$('#st').value,ts=tv?tsOf(tv):0,e=m=>$('#er').textContent=m;if(sel!=today())return e('只能在當天登記入座');if(!ts)return e('請填入座時間');if(ts>Date.now()+60000)return e('入座時間不能晚於現在');r.seatedAt=ts;save();closeM();stage()}
function leave(id){S.recs.find(x=>x.id==id).done=Date.now();save();closeM();stage()}
function move(id){const o=S.recs.find(x=>x.id==id),t=$('#mv').value,w=$('#mw').value,e=m=>$('#er').textContent=m;
if(w&&w==t)return e('主座位和併桌不能是同一桌');if(w&&w[0]!=t[0])return e('併桌需在同一樓層');if(o.pax>cap(t,w))return e(`容量不足（最多 ${cap(t,w)} 人）`);
if((t[0]=='B'||w[0]=='B')&&kids(o)>0)return e('二樓不可有 12 歲以下小孩');
const tv=$('#et').value,ts=(tv&&tv!==hm(o.seatedAt))?tsOf(tv):o.seatedAt;if(ts>Date.now()+60000)return e('入座時間不能晚於現在');o.seatedAt=ts;o.seat=t;o.w=w;save();closeM();fl=t[0];stage()}
boot();
</script></body></html>
